name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Demonstrate malformed-URL regression on the pre-fix route
        run: |
          cp src/app/api/chat/route.ts /tmp/fixed-chat-route.ts
          trap 'cp /tmp/fixed-chat-route.ts src/app/api/chat/route.ts' EXIT
          git show b637993:src/app/api/chat/route.ts > src/app/api/chat/route.ts
          if pnpm exec vitest run test/app/api/chat/route.test.ts -t 'malformed file URLs return 400' > /tmp/pre-fix.log 2>&1; then
            cat /tmp/pre-fix.log
            echo "Regression unexpectedly passed on the defective route"
            exit 1
          fi
          cat /tmp/pre-fix.log
          grep -q '2 failed' /tmp/pre-fix.log
      - parallel:
          - name: Lint
            run: pnpm format:check && pnpm lint

          - name: Typecheck
            run: pnpm typecheck

          - name: Test chat and profile behavior
            run: pnpm test

          - name: Build with synthetic resume
            run: pnpm build:test

      - name: Install Chromium for deterministic browser journeys
        run: pnpm exec e2e-web install chromium --with-deps
      - name: Test chat and resume journeys on the fixture build
        run: pnpm exec e2e run --reporter list,junit
        env:
          E2E_TELEMETRY_DISABLED: "1"
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: warn
